services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hojebelem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hojebelem"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hojebelem?schema=public
      AUTH_SECRET: local-development-secret-change-me
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile.collector
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hojebelem
      SYMPLA_BASE_URL: https://www.sympla.com.br/eventos/belem-pa
      COLLECTOR_MAX_PAGES: 5
      COLLECTOR_MAX_DAYS_AHEAD: 120
      COLLECTOR_AUTO_PUBLISH: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: